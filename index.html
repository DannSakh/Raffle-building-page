<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Village Heroes Raffle</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .main-layout {
            display: grid;
            gap: 30px;
            margin-top: 30px;
            transition: all 0.5s ease;
        }

        .main-layout.before-spin { grid-template-columns: 400px 1fr; }
        .main-layout.after-spin  { grid-template-columns: 450px 1fr; }

        .left-section { display: flex; flex-direction: column; gap: 20px; }

        .right-section {
            display: flex;
            flex-direction: column;
            gap: 0;
            transition: 0.5s;
            min-height: 0;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 2.5em; color:#4a5568; }

        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .file-upload input { display: none; }

        .file-upload label {
            background: #4299e1;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .spin-btn, .reset-btn {
            padding: 15px 30px;
            border-radius: 10px;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .spin-btn {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: white;
        }

        .reset-btn {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: white;
        }

        .wheel-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 400px;
            position: relative;
        }

        .wheel {
            width: 400px;
            height: 400px;
            border-radius: 50%;
            border: 6px solid #2d3748;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .wheel-segment {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .wheel-center {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 110px; height: 110px;
            background: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .wheel-center img { width: 95px; height: 95px; object-fit: contain; }

        .winners-display {
            padding: 20px;
            border-radius: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .main-layout.before-spin .winners-display {
            background: #f7fafc;
            border: 2px dashed #cbd5e0;
            color: #a0aec0;
            font-weight: bold;
            display: flex; justify-content: center; align-items: center;
            height: 200px;
        }

        /* ====================== NEW WINNER CARD DESIGN ======================= */

        #winnersContainer {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .winner-card {
            width: 100%;
            padding: 22px 28px;
            border-radius: 14px;
            background: rgba(255,255,255,0.97);
            box-shadow: 0 4px 14px rgba(0,0,0,0.16);
            display: flex;
            flex-direction: column;
            gap: 18px;
            animation: slideIn 0.5s ease-out;
        }

        .winner-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .winner-number {
            font-size: 1.6em;
            font-weight: bold;
            color: #667eea;
        }

        .participant-name {
            font-size: 1.6em;
            font-weight: bold;
            color: #2d3748;
            text-align: right;
        }

        .prize-box {
            width: 75%;
            margin: 0 auto;
            padding: 14px 22px;
            text-align: center;
            font-size: 1.8em;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>

<body>
<div class="container">

    <div class="header">
        <h1>🏆 Village Heroes Raffle</h1>
        <p>Upload participants and spin to win!</p>
    </div>

    <div class="controls">
        <div class="file-upload">
            <input id="fileInput" type="file" accept=".xlsx,.xls" />
            <label for="fileInput">📁 Upload Excel File</label>
        </div>

        <button id="spinBtn" class="spin-btn" disabled>🎲 Spin</button>
        <button id="resetBtn" class="reset-btn" disabled>Reset</button>
    </div>

    <div id="mainLayout" class="main-layout before-spin">
        <div class="left-section">

            <div class="info-panels">
                <div id="participantsInfo" class="participants-info" style="display:none;">
                    <strong>Total Participants:</strong>
                    <span id="participantCount">0</span>
                </div>

                <div id="winnersInfo" class="winners-info" style="display:none;">
                    <strong>Winners so far:</strong>
                    <span id="winnersSoFar">0</span>
                    |
                    <strong>Remaining:</strong>
                    <span id="remainingCount">0</span>
                </div>
            </div>

            <div id="roundInfo" class="round-info" style="display:none;"></div>

            <div class="wheel-container">
                <div id="wheel" class="wheel">
                    <div style="text-align:center; margin-top:180px; color:#666;">
                        Upload participants to start
                    </div>
                </div>

                <div class="wheel-center">
                    <img src="logo.png" alt="" onerror="this.style.display='none'">
                </div>
            </div>

        </div>

        <div class="right-section">
            <div id="winnersDisplay" class="winners-display">
                <p>🎲 Spin the wheel to see winners here!</p>
            </div>
        </div>
    </div>
</div>


<script>
/* ================== CONFIG =================== */

const WINNERS_PER_ROUND = 3;
const PRIZES = ["500 QAR", "250 QAR", "250 QAR"];

let participants = [];
let usedParticipants = [];
let totalWinnersCount = 0;
let isSpinning = false;


const fileInput = document.getElementById("fileInput");
const spinBtn = document.getElementById("spinBtn");
const resetBtn = document.getElementById("resetBtn");
const wheel = document.getElementById("wheel");
const winnersDisplay = document.getElementById("winnersDisplay");
const participantCount = document.getElementById("participantCount");
const winnersSoFar = document.getElementById("winnersSoFar");
const remainingCount = document.getElementById("remainingCount");
const participantsInfo = document.getElementById("participantsInfo");
const winnersInfo = document.getElementById("winnersInfo");
const roundInfo = document.getElementById("roundInfo");


/* ================== FILE UPLOAD =================== */

fileInput.addEventListener("change", handleFileUpload);

function handleFileUpload(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(ev) {
        const data = new Uint8Array(ev.target.result);
        const workbook = XLSX.read(data, { type: "array" });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

        participants = [];
        usedParticipants = [];

        rows.forEach(row => {
            if (row && row.some(c => c !== undefined && c !== "")) {
                participants.push({
                    displayText: row.filter(c=>c).join(" | "),
                    rawData: row
                });
            }
        });

        participantCount.textContent = participants.length;
        participantsInfo.style.display = "block";
        winnersInfo.style.display = "block";

        roundInfo.style.display = "block";
        roundInfo.innerHTML = `
            <h3>Raffle Prizes</h3>
            <p>• 500 QAR</p>
            <p>• 250 QAR</p>
            <p>• 250 QAR</p>
        `;

        createWheel();
        spinBtn.disabled = false;
        resetBtn.disabled = true;

        updateWinnersInfo();
        winnersDisplay.innerHTML = "<p>🎲 Spin the wheel to see winners here!</p>";
    };
    reader.readAsArrayBuffer(file);
}



/* ================== WHEEL =================== */

function createWheel() {
    wheel.innerHTML = "";
    const colors = ["#ff6b6b","#4ecdc4","#45b7d1","#96ceb4","#ffeaa7","#dda0dd",
                    "#98d8c8","#f7dc6f","#bb8fce","#85c1e9"];

    const count = participants.length;
    const angle = 360 / count;

    participants.forEach((p, i) => {
        const seg = document.createElement("div");
        seg.classList.add("wheel-segment");

        const start = i * angle - 90;
        const end = (i + 1) * angle - 90;

        const x1 = 50 + 50 * Math.cos(start * Math.PI/180);
        const y1 = 50 + 50 * Math.sin(start * Math.PI/180);
        const x2 = 50 + 50 * Math.cos(end * Math.PI/180);
        const y2 = 50 + 50 * Math.sin(end * Math.PI/180);

        seg.style.clipPath = `polygon(50% 50%, ${x1}% ${y1}%, ${x2}% ${y2}%)`;
        seg.style.background = colors[i % colors.length];

        wheel.appendChild(seg);
    });
}



/* ================== FISHER–YATES =================== */

function shuffle(array) {
    let m = array.length, i;
    while (m) {
        i = Math.floor(Math.random() * m--);
        [array[m], array[i]] = [array[i], array[m]];
    }
    return array;
}



/* ================== SPIN =================== */

spinBtn.addEventListener("click", spinWheel);

function spinWheel() {
    if (isSpinning) return;
    isSpinning = true;

    const available = participants.filter(p => !usedParticipants.includes(p));
    const shuffled = shuffle([...available]);
    const winners = shuffled.slice(0, WINNERS_PER_ROUND);

    winners.forEach(w => usedParticipants.push(w));

    updateWinnersInfo();

    const rotation = 360 * (5 + Math.random()*3);
    wheel.style.transition = "4s cubic-bezier(0.17,0.67,0.12,0.99)";
    wheel.style.transform = `rotate(${rotation}deg)`;

    setTimeout(() => {
        displayWinners(winners);
        resetBtn.disabled = false;
        isSpinning = false;
    }, 4000);
}



/* ================== DISPLAY WINNERS =================== */

function displayWinners(winners) {
    winnersDisplay.innerHTML = `<h2>🎉 Winners! 🎉</h2><div id="winnersContainer"></div>`;
    const container = document.getElementById("winnersContainer");

    winners.forEach((winnerObj, index) => {
        const card = document.createElement("div");
        card.className = "winner-card";

        const number = index + 1;

        card.innerHTML = `
            <div class="winner-row">
                <span class="winner-number">🏆 Winner ${number}</span>
                <span class="participant-name">${winnerObj.displayText}</span>
            </div>

            <div class="prize-box">🎁 ${PRIZES[index]}</div>
        `;

        container.appendChild(card);
    });
}



/* ================== RESET =================== */

resetBtn.addEventListener("click", () => {
    usedParticipants = [];
    winnersDisplay.innerHTML = "<p>🎲 Spin the wheel to see winners here!</p>";
    updateWinnersInfo();
    resetBtn.disabled = true;
});


/* ================== UPDATE INFO =================== */

function updateWinnersInfo() {
    winnersSoFar.textContent = usedParticipants.length;
    remainingCount.textContent = participants.length - usedParticipants.length;
}

</script>

</body>
</html>
