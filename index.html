<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Village Heroes Raffle</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* ——— (CSS полностью сохраняю без изменений) ——— */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .main-layout {
            display: grid;
            gap: 30px;
            margin-top: 30px;
            transition: all 0.5s ease;
        }

        .main-layout.before-spin {
            grid-template-columns: 400px 1fr;
        }

        .main-layout.after-spin {
            grid-template-columns: 450px 1fr;
        }

        .left-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .right-section {
            display: flex;
            flex-direction: column;
            gap: 0;
            transition: all 0.5s ease;
            min-height: 0;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #4a5568;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }

        .file-upload {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-upload input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-upload label {
            background: #4299e1;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .spin-btn {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .reset-btn {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .info-panels {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .participants-info,
        .winners-info {
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .participants-info {
            background: #f7fafc;
            border-left: 5px solid #4299e1;
        }

        .winners-info {
            background: #fff5f5;
            border-left: 5px solid #e74c3c;
        }

        .round-info {
            background: #f0f4ff;
            border-left: 5px solid #667eea;
            padding: 20px;
            border-radius: 10px;
        }

        .wheel-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 400px;
        }

        .wheel {
            width: 400px;
            height: 400px;
            border-radius: 50%;
            border: 6px solid #2d3748;
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .wheel-center {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: white;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .winner-card {
            background: rgba(255,255,255,0.95);
            padding: 14px 26px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            gap: 16px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🏆 Village Heroes Raffle</h1>
        <p>Upload participants and spin to win!</p>
    </div>

    <div class="controls">
        <div class="file-upload">
            <input type="file" id="fileInput" accept=".xlsx,.xls">
            <label for="fileInput">📁 Upload Excel File</label>
        </div>

        <button id="spinBtn" class="spin-btn" disabled>🎲 Spin the Wheel!</button>
        <button id="resetBtn" class="reset-btn" disabled>🔄 Reset</button>
    </div>

    <div id="statusMessage" class="status-message"></div>

    <div id="mainLayout" class="main-layout before-spin">

        <div class="left-section">

            <div class="info-panels">
                <div id="participantsInfo" class="participants-info" style="display:none;">
                    <strong>Total Participants:</strong> <span id="participantCount">0</span>
                </div>

                <div id="winnersInfo" class="winners-info" style="display:none;">
                    <strong>Winners:</strong> <span id="winnersSoFar">0</span>  
                    | <strong>Remaining:</strong> <span id="remainingCount">0</span>
                </div>
            </div>

            <div id="roundInfo" class="round-info" style="display:none;"></div>

            <div class="wheel-container">
                <div id="wheel" class="wheel">
                    <div style="text-align:center; margin-top:180px;">Upload participants to start</div>
                </div>
                <div class="wheel-center">
                    <img src="logo.png" alt="" onerror="this.style.display='none'">
                </div>
            </div>
        </div>

        <div class="right-section">
            <div id="winnersDisplay" class="winners-display">
                <p>🎲 Spin the wheel to see winners here!</p>
            </div>
        </div>

    </div>
</div>

<script>
/* -----------------------------
   CONFIG
------------------------------*/

// ★ UPDATED — новые названия призов
const PRIZES = ['500 QAR', '250 QAR', '250 QAR'];
const WINNERS_PER_ROUND = 3;

let participants = [];
let usedParticipants = [];
let totalWinnersCount = 0;
let isSpinning = false;
let hasSpunOnce = false;

const fileInput = document.getElementById('fileInput');
const spinBtn = document.getElementById('spinBtn');
const resetBtn = document.getElementById('resetBtn');
const wheel = document.getElementById('wheel');
const winnersDisplay = document.getElementById('winnersDisplay');
const participantsInfo = document.getElementById('participantsInfo');
const participantCount = document.getElementById('participantCount');
const winnersInfo = document.getElementById('winnersInfo');
const winnersSoFar = document.getElementById('winnersSoFar');
const remainingCount = document.getElementById('remainingCount');
const mainLayout = document.getElementById('mainLayout');
const roundInfo = document.getElementById('roundInfo');


/* ================================================================
   ★ UPDATED — ЧЕСТНЫЙ AЛГОРИТМ FISHER–YATES SHUFFLE
=================================================================*/

function shuffleFisherYates(array) {
    let m = array.length, i, temp;

    while (m) {
        i = Math.floor(Math.random() * m--);
        temp = array[m];
        array[m] = array[i];
        array[i] = temp;
    }
    return array;
}


/* ================================================================
   FILE UPLOAD
=================================================================*/

fileInput.addEventListener('change', handleFileUpload);

function handleFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

        participants = [];
        usedParticipants = [];

        for (let row of json) {
            if (row && row.some(cell => cell !== undefined && cell !== "")) {
                const text = row.filter(c => c).join(" | ");
                participants.push({ displayText: text, rawData: row });
            }
        }

        participantCount.textContent = participants.length;
        participantsInfo.style.display = 'block';
        winnersInfo.style.display = 'block';

        roundInfo.style.display = 'block';
        roundInfo.innerHTML = `
            <h3>Raffle Prizes</h3>
            <p>• 500 QAR</p>
            <p>• 250 QAR</p>
            <p>• 250 QAR</p>
        `;

        createWheel();
        spinBtn.disabled = false;
        resetBtn.disabled = true;
        updateWinnersInfo();
    };

    reader.readAsArrayBuffer(file);
}


/* ================================================================
   BUILD WHEEL
=================================================================*/

function createWheel() {
    wheel.innerHTML = "";
    const colors = [
        '#ff6b6b','#4ecdc4','#45b7d1','#96ceb4','#ffeaa7',
        '#dda0dd','#98d8c8','#f7dc6f','#bb8fce','#85c1e9'
    ];

    const count = participants.length;
    const angle = 360 / count;

    participants.forEach((p, i) => {
        const seg = document.createElement('div');
        seg.className = 'wheel-segment';

        const rot = i * angle;
        const nextRot = (i + 1) * angle;

        const start = rot - 90;
        const end = nextRot - 90;

        const x1 = 50 + 50 * Math.cos(start * Math.PI/180);
        const y1 = 50 + 50 * Math.sin(start * Math.PI/180);
        const x2 = 50 + 50 * Math.cos(end   * Math.PI/180);
        const y2 = 50 + 50 * Math.sin(end   * Math.PI/180);

        seg.style.position = "absolute";
        seg.style.width = "100%";
        seg.style.height = "100%";
        seg.style.background = colors[i % colors.length];
        seg.style.clipPath = `polygon(50% 50%, ${x1}% ${y1}%, ${x2}% ${y2}%)`;

        wheel.appendChild(seg);
    });
}


/* ================================================================
   SPIN LOGIC + FAIR WINNER SELECTION
=================================================================*/

spinBtn.addEventListener('click', spinWheel);

function spinWheel() {
    if (isSpinning) return;
    if (participants.length === 0) return;

    const available = participants.filter(p => !usedParticipants.includes(p));

    if (available.length < WINNERS_PER_ROUND) {
        alert("Not enough participants remaining!");
        return;
    }

    isSpinning = true;
    spinBtn.disabled = true;

    // Rotation animation
    const turns = 5 + Math.random() * 3;
    const deg = turns * 360;

    wheel.style.transition = "transform 4s cubic-bezier(0.17,0.67,0.12,0.99)";
    wheel.style.transform = `rotate(${deg}deg)`;

    setTimeout(() => {
        /* ★ UPDATED — ЧЕСТНЫЙ ВЫБОР ПО ФИШЕР–ЙЕТСУ */
        const shuffled = shuffleFisherYates([...available]);
        const winners = shuffled.slice(0, WINNERS_PER_ROUND);

        winners.forEach(w => usedParticipants.push(w));

        displayWinners(winners);
        updateWinnersInfo();

        resetBtn.disabled = false;
        isSpinning = false;

    }, 4000);
}


/* ================================================================
   DISPLAY WINNERS
=================================================================*/

function displayWinners(winners) {
    winnersDisplay.innerHTML = `<h2>🎉 Winners! 🎉</h2><div id="winnersContainer"></div>`;
    const cont = document.getElementById("winnersContainer");

    winners.forEach((w, i) => {
        const card = document.createElement("div");
        card.className = "winner-card";

        card.innerHTML = `
            <span class="winner-number">🏆 Winner:</span>
            <span class="participant-name">${w.displayText}</span>
            <span class="prize-name">🎁 ${PRIZES[i]}</span>
        `;

        cont.appendChild(card);
    });
}


/* ================================================================
   RESET
=================================================================*/

resetBtn.addEventListener('click', function() {
    usedParticipants = [];
    winnersDisplay.innerHTML = `<p>🎲 Spin the wheel to see winners here!</p>`;
    updateWinnersInfo();
    resetBtn.disabled = true;
    spinBtn.disabled = false;
});


/* ================================================================
   UPDATE INFO PANELS
=================================================================*/

function updateWinnersInfo() {
    winnersSoFar.textContent = usedParticipants.length;
    remainingCount.textContent = participants.length - usedParticipants.length;
}

</script>

</body>
</html>
