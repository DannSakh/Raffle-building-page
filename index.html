<script>
        // --- CONFIGURATION ---
        const WINNERS_PER_ROUND = 3;
        const PRIZES = ['500 QAR', '250 QAR', '250 QAR'];
        
        // --- STATE ---
        let participants = [];
        let usedParticipants = []; 
        let allWinnersHistory = []; 
        let isSpinning = false;

        // --- DOM ELEMENTS ---
        const el = {
            file: document.getElementById('fileInput'),
            spin: document.getElementById('spinBtn'),
            reset: document.getElementById('resetBtn'),
            download: document.getElementById('downloadBtn'),
            wheel: document.getElementById('wheel'),
            layout: document.getElementById('mainLayout'),
            status: document.getElementById('statusBar'),
            statsPanel: document.getElementById('statsPanel'),
            cTotal: document.getElementById('countTotal'),
            cWinners: document.getElementById('countWinners'),
            cRemain: document.getElementById('countRemaining'),
            roundInfo: document.getElementById('roundInfo'),
            readyMsg: document.getElementById('readyMsg'),
            wDisplay: document.getElementById('winnersDisplay'),
            wContainer: document.getElementById('winnersContainer'),
            wPlaceholder: document.getElementById('winnersPlaceholder')
        };

        // --- INITIALIZATION ---
        // ★ NEW: При запуске проверяем, есть ли сохраненные данные
        window.addEventListener('DOMContentLoaded', loadStateFromStorage);

        el.file.addEventListener('change', handleFileUpload);
        el.spin.addEventListener('click', runSpin);
        el.reset.addEventListener('click', fullReset);
        el.download.addEventListener('click', downloadWinnersExcel);

        // ★ NEW: Предупреждение при попытке закрыть вкладку, если есть победители
        window.onbeforeunload = function() {
            if (allWinnersHistory.length > 0) {
                return "You have unsaved winners. Are you sure?";
            }
        };

        function showStatus(msg, type='success') {
            el.status.textContent = msg;
            el.status.className = `status-bar status-${type}`;
            el.status.style.display = 'block';
            setTimeout(() => { el.status.style.display = 'none'; }, 5000);
        }

        // --- LOGIC: STORAGE (Новые функции сохранения) ---
        function saveStateToStorage() {
            const state = {
                participants,
                usedParticipants,
                allWinnersHistory
            };
            localStorage.setItem('raffleState', JSON.stringify(state));
        }

        function loadStateFromStorage() {
            const saved = localStorage.getItem('raffleState');
            if (saved) {
                const state = JSON.parse(saved);
                if (state.participants && state.participants.length > 0) {
                    // Восстанавливаем данные
                    participants = state.participants;
                    usedParticipants = state.usedParticipants || [];
                    allWinnersHistory = state.allWinnersHistory || [];
                    
                    // Восстанавливаем UI
                    restoreUI();
                    showStatus("♻️ Session restored from backup!", "success");
                }
            }
        }

        function restoreUI() {
            // Обновляем статистику
            el.cTotal.textContent = participants.length;
            el.statsPanel.style.display = 'block';
            updateStats();
            renderWheelSegments();
            initRoundInfo();

            // Включаем кнопки
            el.spin.disabled = false;
            el.reset.disabled = false;
            
            // Если уже были победители, показываем экран результатов
            if (allWinnersHistory.length > 0) {
                el.download.style.display = 'inline-flex';
                el.layout.classList.remove('before-spin');
                el.layout.classList.add('after-spin');
                el.readyMsg.style.display = 'none';
                el.wPlaceholder.style.display = 'none';
                
                // Перерисовываем карточки
                el.wContainer.innerHTML = '';
                // Показываем последних победителей (или всех)
                // Для простоты покажем весь список в обратном порядке (новые сверху)
                const reversedHistory = [...allWinnersHistory].reverse();
                reversedHistory.forEach((w) => {
                    createWinnerCard(w, false); // false = без анимации появления
                });
            } else {
                el.layout.classList.add('before-spin');
                el.readyMsg.style.display = 'block';
            }
        }

        // --- LOGIC: FILE UPLOAD ---
        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet, {header: 1});

                    participants = [];
                    jsonData.forEach(row => {
                        const text = row.filter(c => c).join(' | ').trim();
                        if (text) participants.push(text);
                    });

                    if (participants.length === 0) throw new Error("No valid names found");

                    // Сброс при загрузке нового файла
                    usedParticipants = [];
                    allWinnersHistory = [];
                    saveStateToStorage(); // Сохраняем чистое состояние
                    
                    // UI Updates
                    el.cTotal.textContent = participants.length;
                    el.statsPanel.style.display = 'block';
                    updateStats();
                    renderWheelSegments();
                    initRoundInfo();
                    
                    el.spin.disabled = false;
                    el.reset.disabled = true;
                    el.download.style.display = 'none';
                    el.layout.classList.remove('after-spin');
                    el.layout.classList.add('before-spin');
                    el.readyMsg.style.display = 'block';
                    el.wContainer.innerHTML = '';
                    el.wPlaceholder.style.display = 'block';
                    
                    showStatus(`Loaded ${participants.length} participants! Ready.`);

                } catch (err) {
                    console.error(err);
                    showStatus("Error reading file. Check format.", "error");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // --- LOGIC: WHEEL RENDER ---
        function renderWheelSegments() {
            el.wheel.innerHTML = '';
            const count = participants.length;
            const colors = ['#ff6b6b', '#4ecdc4', '#ffeaa7', '#a29bfe', '#fab1a0', '#74b9ff', '#81ecec', '#fd79a8'];
            const renderCount = Math.min(count, 30); 
            const segmentAngle = 360 / renderCount;

            for(let i=0; i<renderCount; i++) {
                const segment = document.createElement('div');
                segment.className = 'wheel-segment';
                const rotate = i * segmentAngle;
                segment.style.background = `conic-gradient(${colors[i % colors.length]} ${segmentAngle}deg, transparent 0)`;
                segment.style.transform = `rotate(${rotate}deg)`;
                segment.style.width = "100%";
                segment.style.height = "100%";
                segment.style.borderRadius = "50%";
                el.wheel.appendChild(segment);
            }
        }

        function initRoundInfo() {
            el.roundInfo.innerHTML = `
                <h3>Raffle Prizes</h3>
                ${PRIZES.map(p => `<p>• ${p}</p>`).join('')}
                <div class="total-left">Picking ${WINNERS_PER_ROUND} winners per spin</div>
            `;
            el.roundInfo.style.display = 'block';
        }

        // --- LOGIC: SPIN & WIN ---
        function runSpin() {
            if (isSpinning) return;
            const available = participants.filter(p => !usedParticipants.includes(p));
            
            if (available.length < WINNERS_PER_ROUND) {
                showStatus(`Not enough participants! Need ${WINNERS_PER_ROUND}.`, 'error');
                return;
            }

            isSpinning = true;
            el.spin.disabled = true;
            el.layout.classList.add('spinning-mode'); 
            el.wheel.classList.add('spinning');

            // Logic: Fisher-Yates
            for (let i = available.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [available[i], available[j]] = [available[j], available[i]];
            }
            const currentWinners = available.slice(0, WINNERS_PER_ROUND);

            // Visual Spin
            const baseRot = 1800; 
            const randRot = Math.floor(Math.random() * 360);
            const totalRot = baseRot + randRot;
            const currentTransform = el.wheel.style.transform;
            const currentDeg = currentTransform ? parseInt(currentTransform.replace(/[^\d-]/g, '')) : 0;
            const finalDeg = currentDeg + totalRot;

            el.wheel.style.transform = `rotate(${finalDeg}deg)`;

            // Reveal
            setTimeout(() => {
                isSpinning = false;
                el.wheel.classList.remove('spinning');
                
                // Переключаем лейаут СРАЗУ перед показом карточек
                el.layout.classList.remove('before-spin');
                el.layout.classList.add('after-spin');
                el.readyMsg.style.display = 'none';
                el.wPlaceholder.style.display = 'none';

                // Очищаем контейнер, чтобы показать только ЭТОТ раунд?
                // Или добавляем сверху? 
                // Давай добавлять СВЕРХУ (prepend), чтобы новые были первыми
                
                const roundWinnersData = [];
                currentWinners.forEach((name, idx) => {
                    usedParticipants.push(name);
                    const prize = PRIZES[idx];
                    const rank = allWinnersHistory.length + 1;
                    
                    const winObj = { rank, name, prize };
                    roundWinnersData.push(winObj);
                    allWinnersHistory.push(winObj);
                    
                    createWinnerCard(winObj, true); // true = с анимацией
                });

                updateStats();
                saveStateToStorage(); // ★ Сохраняем прогресс
                triggerConfetti();
                
                el.reset.disabled = false;
                el.download.style.display = 'inline-flex';
                
                if ((participants.length - usedParticipants.length) >= WINNERS_PER_ROUND) {
                    el.spin.disabled = false;
                } else {
                    showStatus("Raffle Complete! No more participants.", "success");
                }

            }, 4000);
        }

        // Helper для создания карточки
        function createWinnerCard(w, animate) {
            const card = document.createElement('div');
            card.className = 'winner-card';
            if (animate) {
                card.style.animation = 'slideIn 0.5s ease-out backwards';
            }
            card.innerHTML = `
                <div class="winner-rank">#${w.rank}</div>
                <div class="winner-name">${w.name}</div>
                <div class="winner-prize">${w.prize}</div>
            `;
            // Добавляем в начало списка (новые сверху)
            el.wContainer.insertBefore(card, el.wContainer.firstChild);
        }

        function updateStats() {
            el.cWinners.textContent = usedParticipants.length;
            el.cRemain.textContent = participants.length - usedParticipants.length;
        }

        function triggerConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };
            var random = function(min, max) { return Math.random() * (max - min) + min; }
            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);
                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: random(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: random(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        // --- LOGIC: DOWNLOAD & RESET ---
        function downloadWinnersExcel() {
            if (allWinnersHistory.length === 0) return;
            const ws = XLSX.utils.json_to_sheet(allWinnersHistory);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Winners");
            XLSX.writeFile(wb, "Raffle_Winners.xlsx");
        }

        function fullReset() {
            // ★ Safety check: авто-скачивание перед удалением
            if (allWinnersHistory.length > 0) {
                if(confirm("Download winners list before resetting?")) {
                    downloadWinnersExcel();
                }
            }

            if (!confirm("⚠️ Are you sure you want to RESET ALL DATA? This cannot be undone.")) return;
            
            usedParticipants = [];
            allWinnersHistory = [];
            localStorage.removeItem('raffleState'); // ★ Очищаем хранилище
            
            updateStats();
            
            el.layout.classList.remove('after-spin');
            el.layout.classList.add('before-spin');
            el.readyMsg.style.display = 'block';
            el.wPlaceholder.style.display = 'block';
            el.wContainer.innerHTML = '';
            el.download.style.display = 'none';
            el.spin.disabled = false;
            el.reset.disabled = true;
            el.wheel.style.transition = 'none';
            el.wheel.style.transform = 'rotate(0deg)';
            
            showStatus("System Reset. Ready for new raffle.", "success");
        }
    </script>
