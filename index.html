<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Village Heroes Raffle - Scenario Mode</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* --- ТВОИ ОРИГИНАЛЬНЫЕ СТИЛИ --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1800px; /* Вернула твой размер */
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        /* --- Layout Logic --- */
        .main-layout {
            display: grid;
            gap: 30px;
            margin-top: 30px;
            transition: all 0.5s ease;
        }
        .main-layout.before-spin { grid-template-columns: 400px 1fr; }
        .main-layout.after-spin { grid-template-columns: 450px 1fr; }
        
        .left-section { display: flex; flex-direction: column; gap: 20px; }
        .right-section { display: flex; flex-direction: column; transition: all 0.5s ease; }
        .main-layout.before-spin .right-section { align-items: center; justify-content: start; }
        .main-layout.after-spin .right-section { align-items: stretch; }

        /* --- Header & Controls --- */
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #2d3748; font-size: 2.5em; margin-bottom: 10px; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        .controls { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        
        .btn {
            padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 8px;
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }
        .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

        .btn-upload { background: #4299e1; color: white; }
        .btn-upload:hover { background: #3182ce; }
        
        .btn-spin { background: linear-gradient(45deg, #ff6b6b, #feca57); color: white; }
        .btn-next { background: #6b46c1; color: white; display: none; } /* Кнопка для след. раунда */
        .btn-reset { background: linear-gradient(45deg, #e74c3c, #c0392b); color: white; }
        .btn-download { background: #48bb78; color: white; display: none; }

        .file-upload-wrapper input[type="file"] { display: none; }

        /* --- Info Panels --- */
        .info-panels { display: grid; gap: 15px; }
        .stat-box { padding: 12px; border-radius: 8px; text-align: center; font-size: 0.9em; }
        .stat-participants { background: #ebf8ff; border-left: 4px solid #4299e1; }
        .stat-winners { background: #fff5f5; border-left: 4px solid #e53e3e; }
        
        .round-info { background: #f0f4ff; border-left: 5px solid #667eea; padding: 15px; border-radius: 8px; }
        .round-info h3 { color: #4a5568; margin-bottom: 10px; border-bottom: 1px solid #cbd5e0; padding-bottom: 5px;}
        .round-info ul { list-style: none; padding-left: 5px; }
        .round-info li { padding: 4px 0; font-size: 0.95em; color: #2d3748; }
        .total-left { border-top: 1px solid #cbd5e0; margin-top: 10px; padding-top: 10px; font-weight: bold; color: #5a67d8; }

        /* --- Wheel --- */
        .wheel-container {
            width: 100%; height: 400px; display: flex; justify-content: center; align-items: center; position: relative;
        }
        .wheel {
            width: 380px; height: 380px; border-radius: 50%; border: 8px solid #2d3748;
            position: relative; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        .wheel.spinning { filter: blur(1px); }
        .wheel-segment {
            position: absolute; width: 100%; height: 100%;
            clip-path: polygon(50% 50%, 50% 0%, 100% 0%);
            transform-origin: center;
        }
        .wheel-center {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100px; height: 100px; background: white; border-radius: 50%;
            z-index: 10; box-shadow: 0 0 15px rgba(0,0,0,0.2);
            display: flex; align-items: center; justify-content: center;
        }
        .wheel-center img { width: 80px; height: 80px; object-fit: contain; }

        /* --- Winners Area --- */
        .winners-display {
            width: 100%; padding: 20px; background: #f7fafc; border-radius: 15px;
            min-height: 200px; transition: all 0.3s;
        }
        .main-layout.after-spin .winners-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            max-height: 700px; overflow-y: auto;
        }

        .ready-message {
            font-size: 2em; color: #667eea; text-align: center; font-weight: bold;
            animation: pulse 2s infinite; margin-bottom: 20px;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        #winnersContainer { display: grid; gap: 15px; }
        
        .winner-card {
            background: rgba(255, 255, 255, 0.98); padding: 20px 30px; border-radius: 12px;
            display: flex; align-items: center; gap: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            animation: slideIn 0.5s ease-out backwards;
            transform-origin: left;
        }
        .winner-rank { font-size: 1.5em; font-weight: bold; color: #667eea; min-width: 60px; }
        .winner-name { flex: 1; font-size: 1.5em; font-weight: bold; color: #2d3748; }
        .winner-prize {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;
            padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 1.1em; white-space: normal; text-align: right;
            max-width: 400px;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-50px) scale(0.9); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }

        .status-bar {
            text-align: center; padding: 10px; margin: 10px 0; border-radius: 6px; font-weight: bold; display: none;
        }
        .status-success { background: #c6f6d5; color: #22543d; }
        .status-error { background: #fed7d7; color: #742a2a; }

        @media (max-width: 1000px) {
            .main-layout.before-spin, .main-layout.after-spin { grid-template-columns: 1fr; }
            .wheel { width: 300px; height: 300px; }
            .winner-card { flex-direction: column; text-align: center; gap: 10px; }
            .winner-rank { min-width: auto; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 Welfare Summit 2025: WOC Quiz Raffle</h1>
            <p>Upload participants list (.xlsx) and spin to win!</p>
        </div>

        <div class="controls">
            <div class="file-upload-wrapper">
                <input type="file" id="fileInput" accept=".xlsx,.xls" />
                <label for="fileInput" class="btn btn-upload">📁 Upload Excel</label>
            </div>
            <button id="spinBtn" class="btn btn-spin" disabled>🎲 Spin Wheel</button>
            <button id="nextRoundBtn" class="btn btn-next">⏩ Next Round</button>
            
            <button id="downloadBtn" class="btn btn-download">📥 Save Winners</button>
            <button id="resetBtn" class="btn btn-reset" disabled>🔄 Reset All</button>
        </div>

        <div id="statusBar" class="status-bar"></div>

        <div id="mainLayout" class="main-layout before-spin">
            <div class="left-section">
                <div class="info-panels">
                    <div id="statsPanel" style="display: none;">
                        <div class="stat-box stat-participants">
                            Total Participants: <strong id="countTotal">0</strong>
                        </div>
                        <div class="stat-box stat-winners" style="margin-top:10px;">
                            Global Winners: <strong id="countWinners">0</strong> | Remaining: <strong id="countRemaining">0</strong>
                        </div>
                    </div>
                    <div id="roundInfo" class="round-info" style="display: none;"></div>
                </div>

                <div class="wheel-container">
                    <div id="wheel" class="wheel">
                        <div style="display:flex;justify-content:center;align-items:center;height:100%;color:#aaa;">No Data</div>
                    </div>
                    <div class="wheel-center">
                        <span style="font-size: 40px;">🏆</span>
                    </div>
                </div>
            </div>

            <div class="right-section">
                <div id="readyMsg" class="ready-message" style="display: none;">Ready to Spin!</div>
                
                <div id="winnersDisplay" class="winners-display">
                    <div id="winnersPlaceholder" style="text-align:center; color:#a0aec0; padding-top:80px; font-size:1.2em;">
                        Waiting for results...
                    </div>
                    <div id="winnersContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION: SCENARIO (Данные из твоего скрина) ---
        const RAFFLE_SCENARIO = [
            {
                id: 1,
                title: "Round 1: Melomaniacs",
                prizes: [
                    "Shokz Headphones Openmove Bone Conduction",
                    "Shokz Headphones Openmove Bone Conduction",
                    "JBL Tune 770NC Wireless Headphones With Mic",
                    "JBL Flip 7 Waterproof Portable Bluetooth Speaker"
                ]
            },
            {
                id: 2,
                title: "Round 2: Be the explorer!",
                prizes: [
                    "LePresso Portable Mug Burr Grinder 250ml",
                    "Xiaomi Multi-Function Flashlight",
                    "Leatherman Tool: Wave Plus Black Peg",
                    "Eastpak Tecum L CNNCT Marine Backpack"
                ]
            },
            {
                id: 3,
                title: "Round 3: It's a digital, digital life!",
                prizes: [
                    "LePresso Portable Mug Burr Grinder 250ml",
                    "Xiaomi TV Box S 2Gen 4K UHD UK",
                    "Samsung Tab Galaxy A9 Wifi 8.7 inch 4GB+64GB",
                    "Samsung Tab Galaxy A9 Wifi 8.7 inch 4GB+64GB"
                ]
            },
            {
                id: 4,
                title: "Round 4: Welcome to the iWorld!",
                prizes: [
                    "2024 Apple Watch SE 2 Sport Band 40 mm",
                    "AirPods Pro 3",
                    "11-inch iPad Air M2"
                ]
            },
            {
                id: 5,
                title: "Final round: Grand Prix!",
                prizes: [
                    "iPhone 17 Pro Max 256 GB"
                ]
            }
        ];

        // --- STATE ---
        let participants = [];
        let usedParticipants = []; 
        let allWinnersHistory = []; 
        let currentRoundIndex = 0; // Начинаем с 0 (Раунд 1)
        let isSpinning = false;

        // --- DOM ELEMENTS ---
        const el = {
            file: document.getElementById('fileInput'),
            spin: document.getElementById('spinBtn'),
            next: document.getElementById('nextRoundBtn'),
            reset: document.getElementById('resetBtn'),
            download: document.getElementById('downloadBtn'),
            wheel: document.getElementById('wheel'),
            layout: document.getElementById('mainLayout'),
            status: document.getElementById('statusBar'),
            statsPanel: document.getElementById('statsPanel'),
            cTotal: document.getElementById('countTotal'),
            cWinners: document.getElementById('countWinners'),
            cRemain: document.getElementById('countRemaining'),
            roundInfo: document.getElementById('roundInfo'),
            readyMsg: document.getElementById('readyMsg'),
            wDisplay: document.getElementById('winnersDisplay'),
            wContainer: document.getElementById('winnersContainer'),
            wPlaceholder: document.getElementById('winnersPlaceholder')
        };

        // --- INITIALIZATION ---
        el.file.addEventListener('change', handleFileUpload);
        el.spin.addEventListener('click', runSpin);
        el.next.addEventListener('click', loadNextRound);
        el.reset.addEventListener('click', fullReset);
        el.download.addEventListener('click', downloadWinnersExcel);

        function showStatus(msg, type='success') {
            el.status.textContent = msg;
            el.status.className = `status-bar status-${type}`;
            el.status.style.display = 'block';
            setTimeout(() => { el.status.style.display = 'none'; }, 5000);
        }

        // --- LOGIC: FILE UPLOAD (ВЕРНУЛА СТАРУЮ ЛОГИКУ) ---
        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet, {header: 1});

                    // Твоя старая логика парсинга
                    participants = [];
                    jsonData.forEach(row => {
                        const text = row.filter(c => c).join(' | ').trim();
                        if (text) participants.push(text);
                    });

                    if (participants.length === 0) throw new Error("No valid names found");

                    // Reset State
                    usedParticipants = [];
                    allWinnersHistory = [];
                    currentRoundIndex = 0;
                    
                    // UI Updates
                    el.statsPanel.style.display = 'block';
                    updateStats();
                    renderWheelSegments();
                    
                    // Инициализируем первый раунд
                    initRound(currentRoundIndex);
                    
                    el.reset.disabled = true;
                    el.download.style.display = 'none';
                    showStatus(`Loaded ${participants.length} participants! Ready for Round 1.`);

                } catch (err) {
                    console.error(err);
                    showStatus("Error reading file. Check format.", "error");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // --- LOGIC: ROUND MANAGEMENT ---
        function initRound(index) {
            if (index >= RAFFLE_SCENARIO.length) {
                // Все раунды закончены
                el.roundInfo.innerHTML = "<h3>🎉 Raffle Completed! 🎉</h3>";
                el.spin.style.display = 'none';
                el.next.style.display = 'none';
                el.readyMsg.style.display = 'none';
                return;
            }

            const round = RAFFLE_SCENARIO[index];

            // Обновляем инфо панель слева
            el.roundInfo.innerHTML = `
                <h3>${round.title}</h3>
                <ul>${round.prizes.map(p => `<li>🎁 ${p}</li>`).join('')}</ul>
                <div class="total-left">Picking ${round.prizes.length} winners</div>
            `;
            el.roundInfo.style.display = 'block';

            // Сбрасываем вид справа (возвращаем к "before-spin")
            el.layout.classList.remove('after-spin');
            el.layout.classList.add('before-spin');
            el.wPlaceholder.style.display = 'block';
            el.wContainer.innerHTML = '';
            el.readyMsg.style.display = 'block';
            el.readyMsg.textContent = `Ready for ${round.title}`;

            // Кнопки
            el.spin.disabled = false;
            el.spin.style.display = 'inline-flex';
            el.spin.textContent = "🎲 Spin Wheel";
            el.next.style.display = 'none';
            
            // Сбрасываем вращение колеса визуально
            el.wheel.style.transition = 'none';
            el.wheel.style.transform = 'rotate(0deg)';
        }

        function loadNextRound() {
            currentRoundIndex++;
            initRound(currentRoundIndex);
        }

        // --- LOGIC: WHEEL RENDER ---
        function renderWheelSegments() {
            el.wheel.innerHTML = '';
            const count = participants.length;
            const colors = ['#ff6b6b', '#4ecdc4', '#ffeaa7', '#a29bfe', '#fab1a0', '#74b9ff', '#81ecec', '#fd79a8'];
            const renderCount = Math.min(count, 30); 
            const segmentAngle = 360 / renderCount;

            for(let i=0; i<renderCount; i++) {
                const segment = document.createElement('div');
                segment.className = 'wheel-segment';
                const rotate = i * segmentAngle;
                segment.style.background = `conic-gradient(${colors[i % colors.length]} ${segmentAngle}deg, transparent 0)`;
                segment.style.transform = `rotate(${rotate}deg)`;
                segment.style.width = "100%";
                segment.style.height = "100%";
                segment.style.borderRadius = "50%";
                el.wheel.appendChild(segment);
            }
        }

        // --- LOGIC: SPIN & WIN ---
        function runSpin() {
            if (isSpinning) return;
            
            // Берем данные текущего раунда
            const roundData = RAFFLE_SCENARIO[currentRoundIndex];
            const winnersNeeded = roundData.prizes.length;

            const available = participants.filter(p => !usedParticipants.includes(p));
            
            if (available.length < winnersNeeded) {
                showStatus(`Not enough participants! Need ${winnersNeeded}, have ${available.length}.`, 'error');
                return;
            }

            isSpinning = true;
            el.spin.disabled = true;
            el.wheel.classList.add('spinning');
            el.wheel.style.transition = 'transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99)';

            // 1. Determine Winners logic
            for (let i = available.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [available[i], available[j]] = [available[j], available[i]];
            }
            const currentWinners = available.slice(0, winnersNeeded);

            // 2. Visual Spin
            const baseRot = 1800; 
            const randRot = Math.floor(Math.random() * 360);
            const totalRot = baseRot + randRot;
            
            // Получаем текущий поворот, чтобы крутить дальше
            const currentTransform = el.wheel.style.transform;
            const currentDeg = currentTransform && currentTransform !== "none" ? parseInt(currentTransform.replace(/[^\d-]/g, '')) : 0;
            const finalDeg = currentDeg + totalRot;

            el.wheel.style.transform = `rotate(${finalDeg}deg)`;

            // 3. Reveal
            setTimeout(() => {
                isSpinning = false;
                el.wheel.classList.remove('spinning');
                
                // Process Winners
                const roundWinnersData = [];
                currentWinners.forEach((name, idx) => {
                    usedParticipants.push(name);
                    const prize = roundData.prizes[idx];
                    const rank = allWinnersHistory.length + 1;
                    
                    const winObj = { Round: roundData.title, Rank: rank, Name: name, Prize: prize };
                    roundWinnersData.push(winObj);
                    allWinnersHistory.push(winObj);
                });

                updateStats();
                showWinnersUI(roundWinnersData);
                triggerConfetti();
                
                // Switch Controls
                el.spin.style.display = 'none';
                el.reset.disabled = false;
                el.download.style.display = 'inline-flex';

                // Если это не последний раунд, показываем кнопку Next
                if (currentRoundIndex < RAFFLE_SCENARIO.length - 1) {
                    el.next.style.display = 'inline-flex';
                } else {
                    // Конец игры
                    showStatus("Grand Prix Finished! Congratulations!", "success");
                }

            }, 4000);
        }

        function showWinnersUI(winners) {
            el.layout.classList.remove('before-spin');
            el.layout.classList.add('after-spin');
            el.readyMsg.style.display = 'none';
            el.wPlaceholder.style.display = 'none';
            el.wContainer.innerHTML = ''; 

            winners.forEach((w, i) => {
                const card = document.createElement('div');
                card.className = 'winner-card';
                card.style.animationDelay = `${i * 0.2}s`;
                card.innerHTML = `
                    <div class="winner-rank">#${i + 1}</div>
                    <div class="winner-name">${w.Name}</div>
                    <div class="winner-prize">${w.Prize}</div>
                `;
                el.wContainer.appendChild(card);
            });
        }

        function updateStats() {
            el.cTotal.textContent = participants.length;
            el.cWinners.textContent = usedParticipants.length;
            el.cRemain.textContent = participants.length - usedParticipants.length;
        }

        function triggerConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };
            var random = function(min, max) { return Math.random() * (max - min) + min; }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);
                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: random(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: random(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        // --- LOGIC: DOWNLOAD & RESET ---
        function downloadWinnersExcel() {
            if (allWinnersHistory.length === 0) return;
            const ws = XLSX.utils.json_to_sheet(allWinnersHistory);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Winners");
            XLSX.writeFile(wb, "Raffle_Winners_Scenario.xlsx");
        }

        function fullReset() {
            if (!confirm("Reset everything? History will be lost.")) return;
            // Просто перезагружаем страницу, так надежнее
            location.reload(); 
        }
    </script>
</body>
</html>
